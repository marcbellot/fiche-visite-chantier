/* ---------- Utilitaires ---------- */
function uid() { return "ch_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function todayISO() { var d = new Date(); return d.toISOString().slice(0, 10); }
function escapeHtml(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function fmtDate(iso) {
  if (!iso) return "—";
  var p = iso.split("-");
  if (p.length !== 3) return iso;
  return p[2] + "/" + p[1] + "/" + p[0];
}
function blankSection(defKey) {
  var out = {};
  SECTION_DEFS[defKey].items.forEach(function (it) { out[it.key] = { etat: null, commentaire: "" }; });
  return out;
}
function blankRecord() {
  return {
    id: uid(), client: "", adresse: "", dateVisite: todayISO(), ttaReferent: "",
    autresTta: "", typeToiture: "",
    securite: blankSection("securite"), organisation: blankSection("organisation"),
    createdAt: new Date().toISOString(), updatedAt: new Date().toISOString()
  };
}
function computeSectionStatus(sectionObj, defKey) {
  var items = SECTION_DEFS[defKey].items;
  var hasEmpty = false, hasMauvais = false, hasMoyen = false;
  items.forEach(function (it) {
    var e = sectionObj && sectionObj[it.key] ? sectionObj[it.key].etat : null;
    if (!e) hasEmpty = true;
    else if (e === "mauvais") hasMauvais = true;
    else if (e === "moyen") hasMoyen = true;
  });
  if (hasEmpty) return "incomplet";
  if (hasMauvais) return "mauvais";
  if (hasMoyen) return "moyen";
  return "bon";
}
function statusMeta(key) {
  return {
    bon: { label: "Bon", cls: "st-bon" },
    moyen: { label: "Moyen", cls: "st-moyen" },
    mauvais: { label: "Mauvais", cls: "st-mauvais" },
    incomplet: { label: "À compléter", cls: "st-incomplet" }
  }[key] || { label: key, cls: "st-incomplet" };
}
function sortedChantiers() {
  return STATE.chantiers.slice().sort(function (a, b) {
    return (b.dateVisite || "").localeCompare(a.dateVisite || "") ||
      (b.updatedAt || "").localeCompare(a.updatedAt || "");
  });
}
function findChantier(id) {
  for (var i = 0; i < STATE.chantiers.length; i++) if (STATE.chantiers[i].id === id) return STATE.chantiers[i];
  return null;
}

/* ---------- Export PDF (copie fidèle de l'écran) ---------- */
function safeFilename(s) {
  return String(s || "chantier").normalize("NFKD").replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-zA-Z0-9-_ ]/g, "").trim().replace(/\s+/g, "-").slice(0, 60) || "chantier";
}
var PDF_LIBS = [
  "https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js",
  "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"
];
var pdfLibsPromise = null;
function loadScript(src) {
  return new Promise(function (resolve, reject) {
    var el = document.createElement("script");
    el.src = src; el.onload = resolve; el.onerror = reject;
    document.head.appendChild(el);
  });
}
function loadPdfLibs() {
  if (window.html2canvas && window.jspdf) return Promise.resolve();
  if (!pdfLibsPromise) {
    pdfLibsPromise = Promise.all(PDF_LIBS.map(loadScript)).catch(function (e) { pdfLibsPromise = null; throw e; });
  }
  return pdfLibsPromise;
}
/* Cherche, en remontant depuis "limit", une ligne de pixels sans texte
   pour éviter de couper une ligne ou un item entre deux pages. */
function findBreak(ctx, width, start, limit) {
  var minY = start + Math.floor((limit - start) * 0.7);
  var data = ctx.getImageData(0, minY, width, limit - minY).data;
  for (var y = limit - minY - 1; y >= 0; y--) {
    var row = y * width * 4, mid = row + Math.floor(width / 2) * 4;
    var r0 = data[mid], g0 = data[mid + 1], b0 = data[mid + 2], diff = 0;
    for (var x = 0; x < width; x += 2) {
      var i = row + x * 4;
      if (Math.abs(data[i] - r0) + Math.abs(data[i + 1] - g0) + Math.abs(data[i + 2] - b0) > 60) diff++;
    }
    if (diff < width * 0.01) return minY + y;
  }
  return limit;
}
function exportPDF(filename, landscape) {
  var root = document.documentElement;
  var prevTheme = root.getAttribute("data-theme");
  var busy = document.createElement("div");
  busy.className = "pdf-busy"; busy.innerHTML = "<div>Préparation du PDF…</div>";
  document.body.appendChild(busy);
  function cleanup() {
    document.body.classList.remove("pdf-mode");
    if (prevTheme == null) root.removeAttribute("data-theme"); else root.setAttribute("data-theme", prevTheme);
    busy.remove();
  }
  loadPdfLibs().then(function () {
    root.setAttribute("data-theme", "light");          // PDF toujours en thème clair
    document.body.classList.add("pdf-mode");
    var target = document.getElementById("app");
    var width = landscape ? 1240 : 900;                 // largeur de mise en page simulée
    return (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(function () {
      return window.html2canvas(target, {
        scale: 2, useCORS: true, backgroundColor: "#F6F5F2",
        windowWidth: width, width: width, scrollX: 0, scrollY: 0,
        onclone: function (doc) { doc.getElementById("app").style.width = width + "px"; }
      });
    });
  }).then(function (canvas) {
    var jsPDF = window.jspdf.jsPDF;
    var pdf = new jsPDF({ orientation: landscape ? "landscape" : "portrait", unit: "mm", format: "a4" });
    var pageW = pdf.internal.pageSize.getWidth(), pageH = pdf.internal.pageSize.getHeight();
    var margin = 8, footer = 6;
    var imgW = pageW - margin * 2;
    var pxPerMm = canvas.width / imgW;
    var pagePx = Math.floor((pageH - margin * 2 - footer) * pxPerMm);
    var ctx = canvas.getContext("2d");
    var slices = [], y = 0;
    while (y < canvas.height) {
      var end = Math.min(y + pagePx, canvas.height);
      if (end < canvas.height) end = findBreak(ctx, canvas.width, y, end);
      slices.push([y, end]); y = end;
    }
    slices.forEach(function (sl, i) {
      if (i > 0) pdf.addPage();
      var h = sl[1] - sl[0];
      var part = document.createElement("canvas");
      part.width = canvas.width; part.height = h;
      var pctx = part.getContext("2d");
      pctx.fillStyle = "#F6F5F2"; pctx.fillRect(0, 0, part.width, h);
      pctx.drawImage(canvas, 0, sl[0], canvas.width, h, 0, 0, canvas.width, h);
      pdf.setFillColor(246, 245, 242); pdf.rect(0, 0, pageW, pageH, "F");
      pdf.addImage(part.toDataURL("image/jpeg", 0.92), "JPEG", margin, margin, imgW, h / pxPerMm);
      pdf.setFontSize(8); pdf.setTextColor(92, 105, 104);
      pdf.text("ATTILA · Fiche de visite chantier · édité le " + fmtDate(todayISO()), margin, pageH - margin + 2);
      pdf.text("Page " + (i + 1) + " / " + slices.length, pageW - margin, pageH - margin + 2, { align: "right" });
    });
    cleanup();
    pdf.save(filename);
  }).catch(function () {
    cleanup();
    /* Pas de réseau pour charger les bibliothèques : impression navigateur (« Enregistrer en PDF ») */
    window.print();
  });
}

/* ---------- Persistance (localStorage) ---------- */
function alertBanner(msg) { lastError = msg; render(); }
function loadLocal() {
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    var parsed = JSON.parse(raw);
    return parsed && Array.isArray(parsed.chantiers) ? parsed : null;
  } catch (e) { storageOk = false; return null; }
}
function saveLocal() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE)); return true; }
  catch (e) { storageOk = false; return false; }
}
function persist(mutateFn) {
  mutateFn(STATE);
  if (!saveLocal()) alertBanner("Enregistrement impossible sur cet appareil (navigation privée ou stockage bloqué). Exportez la fiche en PDF avant de fermer la page.");
}
function normalizeRecord(rec) {
  ["securite", "organisation"].forEach(function (secKey) {
    if (!rec[secKey] || typeof rec[secKey] !== "object") rec[secKey] = {};
    SECTION_DEFS[secKey].items.forEach(function (it) {
      if (!rec[secKey][it.key]) rec[secKey][it.key] = { etat: null, commentaire: "" };
    });
  });
  if (!rec.id) rec.id = uid();
  return rec;
}
/* ---------- Rendu ---------- */
function tabsHtml() {
  function tab(v, label) {
    return '<button type="button" class="tab' + (view === v ? " active" : "") + '" data-nav="' + v + '">' + label + "</button>";
  }
  return '<div class="tabs">' + tab("liste", "Chantiers") + tab("form-new", "Nouvelle fiche") + tab("recap", "Récapitulatif") + "</div>";
}
function shellHtml(inner) {
  var banner = "";
  if (lastError) banner = '<div class="banner"><div class="banner-box">' + escapeHtml(lastError) + "</div></div>";
  else if (!storageOk) banner = '<div class="banner"><div class="banner-box">Stockage indisponible sur ce navigateur : les saisies seront perdues à la fermeture. Exportez vos fiches en PDF avant de quitter.</div></div>';
  return '<div class="topbar"><div class="topbar-inner">' +
    '<div class="brand"><div class="brand-mark"><div class="roof"></div><div class="base"></div></div>' +
    '<div class="brand-word"><b>ATTILA</b><span>répare et entretient vos toits</span></div></div>' +
    '<div class="apptitle">Fiche de visite chantier</div>' + tabsHtml() +
    "</div></div>" + banner +
    '<div class="shell">' + inner +
    '<div class="footnote">Outil interne ATTILA — usage réseau. Les statuts Sécurité et Organisation sont calculés automatiquement à partir des items évalués (le plus défavorable des quatre items détermine le statut de la section) ; une fiche dont un item n’est pas encore évalué affiche « à compléter ». Cette fiche ne remplace pas le document unique d’évaluation des risques ni les obligations réglementaires de l’agence : en cas d’écart constaté, appliquez la procédure sécurité en vigueur.<br>Les fiches sont enregistrées dans le navigateur de cet appareil uniquement. Utilisez l’export PDF pour les transmettre ou les archiver.</div>' +
    "</div>";
}

function renderListe() {
  var list = sortedChantiers();
  var body;
  if (!list.length) {
    body = '<div class="empty">Aucune fiche enregistrée pour l’instant.<br><br>' +
      '<button type="button" class="btn btn-primary" data-nav="form-new">+ Nouvelle fiche</button></div>';
  } else {
    body = '<div class="cardlist">' + list.map(function (rec) {
      var sSec = statusMeta(computeSectionStatus(rec.securite, "securite"));
      var sOrg = statusMeta(computeSectionStatus(rec.organisation, "organisation"));
      return '<button type="button" class="ccard" data-open="' + rec.id + '"><div class="ccard-top">' +
        '<div><div class="ccard-client">' + escapeHtml(rec.client || "(client non renseigné)") + "</div>" +
        '<div class="ccard-meta">' + escapeHtml(rec.adresse || "—") + " · " + fmtDate(rec.dateVisite) +
        " · " + escapeHtml(rec.ttaReferent || "—") + "</div></div>" +
        '<div class="ccard-badges"><span class="pill-status ' + sSec.cls + '">Sécu · ' + sSec.label + "</span>" +
        '<span class="pill-status ' + sOrg.cls + '">Org. · ' + sOrg.label + "</span></div>" +
        "</div></button>";
    }).join("") + "</div>";
  }
  return shellHtml('<div class="pagehead"><div><h1>Chantiers visités</h1>' +
    '<p>' + list.length + " fiche" + (list.length > 1 ? "s" : "") + " enregistrée" + (list.length > 1 ? "s" : "") + "</p></div>" +
    '<button type="button" class="btn btn-primary" data-nav="form-new">+ Nouvelle fiche</button></div>' + body);
}

function evalSectionHtml(defKey, sectionState) {
  var st = statusMeta(computeSectionStatus(sectionState, defKey));
  var items = SECTION_DEFS[defKey].items.map(function (it) {
    var cell = sectionState[it.key] || { etat: null, commentaire: "" };
    var pills = STATES.map(function (s) {
      return '<button type="button" class="pill' + (cell.etat === s.key ? " active" : "") +
        '" data-pill="' + defKey + "|" + it.key + "|" + s.key + '" data-state="' + s.key + '">' +
        s.emoji + " " + s.label + "</button>";
    }).join("");
    return '<div class="evalitem"><div class="evalitem-head">' +
      '<span class="evalitem-label">' + escapeHtml(it.label) + '</span>' +
      '<div class="evalitem-pills" role="group" aria-label="' + escapeHtml(it.label) + '">' + pills + "</div></div>" +
      '<textarea class="evalitem-comment" placeholder="Commentaire (optionnel)" ' +
      'data-comment="' + defKey + "|" + it.key + '">' + escapeHtml(cell.commentaire) + "</textarea></div>";
  }).join("");
  return '<div class="card"><h2>' + SECTION_DEFS[defKey].title + "</h2>" +
    '<div class="sectionstatus"><span class="pill-status ' + st.cls + '">' + st.label + "</span></div>" +
    items + "</div>";
}

function renderForm() {
  var isEdit = !!editingId;
  var rec = draft;
  function field(name, label, type, required, extra) {
    var val = escapeHtml(rec[name]);
    var input = type === "textarea"
      ? '<textarea name="' + name + '">' + val + "</textarea>"
      : '<input type="' + type + '" name="' + name + '" value="' + val + '"' + (extra || "") + ">";
    return '<div class="field" data-field="' + name + '"><label>' + label +
      (required ? ' <span class="req">*</span>' : "") + "</label>" + input +
      '<span class="field-error">Ce champ est obligatoire.</span></div>';
  }
  var datalist = '<datalist id="dl-toiture">' + TYPES_TOITURE.map(function (t) { return '<option value="' + t + '">'; }).join("") + "</datalist>";
  var html = '<div class="pagehead"><div><h1>' + (isEdit ? "Modifier la fiche" : "Nouvelle fiche de visite") + "</h1>" +
    '<p>Champs marqués <span class="req">*</span> obligatoires</p></div></div>' +
    '<form id="chantier-form" novalidate>' +
    '<div class="card"><h2>Chantier</h2><p class="cardsub">Identification de la visite</p><div class="grid">' +
    field("client", "Nom du client", "text", true) +
    field("adresse", "Adresse", "text", true) +
    field("dateVisite", "Date de la visite", "date", true) +
    field("ttaReferent", "Nom du TTA référent", "text", true) +
    field("autresTta", "Nom des autres TTA présents", "text", false) +
    field("typeToiture", "Type de toiture", "text", true, ' list="dl-toiture"') +
    "</div>" + datalist + "</div>" +
    evalSectionHtml("securite", rec.securite) +
    evalSectionHtml("organisation", rec.organisation) +
    '<div class="btnrow" style="margin-top:1.1rem;">' +
    '<button type="submit" class="btn btn-primary">Enregistrer la fiche</button>' +
    '<button type="button" class="btn btn-ghost" data-nav="' + (isEdit ? "detail|" + editingId : "liste") + '">Annuler</button>' +
    "</div></form>";
  return shellHtml(html);
}

function renderDetail() {
  var rec = findChantier(editingId);
  if (!rec) { view = "liste"; return renderListe(); }
  var sSec = statusMeta(computeSectionStatus(rec.securite, "securite"));
  var sOrg = statusMeta(computeSectionStatus(rec.organisation, "organisation"));
  function dfield(label, val) { return '<div class="dfield"><dt>' + label + "</dt><dd>" + escapeHtml(val || "—") + "</dd></div>"; }
  function sectionDetail(defKey, sectionState, statusM) {
    var items = SECTION_DEFS[defKey].items.map(function (it) {
      var cell = sectionState[it.key] || { etat: null, commentaire: "" };
      var em = cell.etat ? STATES.filter(function (s) { return s.key === cell.etat; })[0] : null;
      return '<div class="ditem"><div><div class="ditem-label">' + escapeHtml(it.label) + "</div>" +
        (cell.commentaire ? '<div class="ditem-comment">' + escapeHtml(cell.commentaire) + "</div>" : "") + "</div>" +
        '<span class="pill-status ' + (cell.etat ? statusMeta(cell.etat).cls : "st-incomplet") + '">' +
        (em ? em.emoji + " " + em.label : "Non évalué") + "</span></div>";
    }).join("");
    return '<div class="card"><h2>' + SECTION_DEFS[defKey].title + "</h2>" +
      '<div class="sectionstatus"><span class="pill-status ' + statusM.cls + '">' + statusM.label + "</span></div>" + items + "</div>";
  }
  var html = '<div class="pagehead"><div><h1>' + escapeHtml(rec.client || "(client non renseigné)") + "</h1>" +
    "<p>Visite du " + fmtDate(rec.dateVisite) + "</p></div>" +
    '<div class="btnrow"><button type="button" class="btn" data-pdf-fiche="' + rec.id + '">Exporter en PDF</button>' +
    '<button type="button" class="btn btn-primary" data-edit="' + rec.id + '">Modifier</button></div></div>' +
    '<div class="card"><h2>Chantier</h2><dl class="detailgrid">' +
    dfield("Client", rec.client) + dfield("Adresse", rec.adresse) + dfield("Date de la visite", fmtDate(rec.dateVisite)) +
    dfield("TTA référent", rec.ttaReferent) + dfield("Autres TTA présents", rec.autresTta) +
    dfield("Type de toiture", rec.typeToiture) +
    "</dl></div>" +
    sectionDetail("securite", rec.securite, sSec) + sectionDetail("organisation", rec.organisation, sOrg) +
    '<div class="btnrow" style="margin-top:1.1rem;"><button type="button" class="btn btn-ghost" data-nav="liste">← Retour à la liste</button></div>';
  return shellHtml(html);
}

function renderRecap() {
  var list = sortedChantiers();
  var rows = list.map(function (rec) {
    var sSec = statusMeta(computeSectionStatus(rec.securite, "securite"));
    var sOrg = statusMeta(computeSectionStatus(rec.organisation, "organisation"));
    return "<tr data-open=\"" + rec.id + "\"><td>" + escapeHtml(rec.client) + "</td><td>" + escapeHtml(rec.adresse) +
      "</td><td class=\"num\">" + fmtDate(rec.dateVisite) + "</td><td>" + escapeHtml(rec.ttaReferent) +
      "</td><td>" + escapeHtml(rec.autresTta) + "</td><td>" + escapeHtml(rec.typeToiture) + "</td>" +
      "<td><span class=\"pill-status " + sSec.cls + "\">" + sSec.label + "</span></td>" +
      "<td><span class=\"pill-status " + sOrg.cls + "\">" + sOrg.label + "</span></td>" +
      "<td class=\"num\">" + fmtDate((rec.updatedAt || "").slice(0, 10)) + "</td></tr>";
  }).join("");
  var table = list.length
    ? '<div class="tablewrap"><table class="recap"><thead><tr><th>Client</th><th>Adresse</th><th>Date visite</th>' +
      "<th>TTA référent</th><th>Autres TTA</th><th>Type toiture</th><th>Statut sécurité</th>" +
      "<th>Statut organisation</th><th>Maj</th></tr></thead><tbody>" + rows + "</tbody></table></div>"
    : '<div class="empty">Aucun chantier à récapituler.</div>';
  return shellHtml('<div class="pagehead"><div><h1>Récapitulatif des chantiers</h1><p>Vue d’ensemble en annexe, tous chantiers confondus</p></div>' +
    '<div class="btnrow"><button type="button" class="btn" data-pdf-recap="1"' + (list.length ? "" : " disabled") + '>Exporter en PDF</button>' +
    '</div></div>' + table);
}

function render() {
  var html;
  if (view === "form") html = renderForm();
  else if (view === "detail") html = renderDetail();
  else if (view === "recap") html = renderRecap();
  else html = renderListe();
  document.getElementById("app").innerHTML = html;
  lastError = "";
}

/* ---------- Validation + soumission du formulaire ---------- */
function validateForm(formEl) {
  var required = ["client", "adresse", "dateVisite", "ttaReferent", "typeToiture"];
  var ok = true;
  required.forEach(function (name) {
    var input = formEl.querySelector('[name="' + name + '"]');
    var fieldEl = formEl.querySelector('[data-field="' + name + '"]');
    var valid = input.value != null && String(input.value).trim() !== "";
    fieldEl.classList.toggle("invalid", !valid);
    if (!valid) ok = false;
  });
  return ok;
}

/* ---------- Écouteurs (délégation, attachés une seule fois) ---------- */
document.addEventListener("click", function (e) {
  var navEl = e.target.closest("[data-nav]");
  if (navEl) {
    var nav = navEl.getAttribute("data-nav");
    if (nav === "form-new") { draft = blankRecord(); editingId = null; view = "form"; }
    else if (nav.indexOf("detail|") === 0) { editingId = nav.split("|")[1]; view = "detail"; }
    else { view = nav; }
    render();
    window.scrollTo(0, 0);
    return;
  }
  var openEl = e.target.closest("[data-open]");
  if (openEl) { editingId = openEl.getAttribute("data-open"); view = "detail"; render(); window.scrollTo(0, 0); return; }

  var editEl = e.target.closest("[data-edit]");
  if (editEl) {
    var rec0 = findChantier(editEl.getAttribute("data-edit"));
    if (rec0) { draft = JSON.parse(JSON.stringify(rec0)); editingId = rec0.id; view = "form"; render(); window.scrollTo(0, 0); }
    return;
  }

  var pillEl = e.target.closest("[data-pill]");
  if (pillEl) {
    var parts = pillEl.getAttribute("data-pill").split("|");
    var secKey = parts[0], itemKey = parts[1], stateKey = parts[2];
    var cur = draft[secKey][itemKey].etat;
    draft[secKey][itemKey].etat = (cur === stateKey) ? null : stateKey;
    var group = pillEl.closest(".evalitem-pills");
    group.querySelectorAll(".pill").forEach(function (p) { p.classList.remove("active"); });
    if (draft[secKey][itemKey].etat) pillEl.classList.add("active");
    var statusBadge = pillEl.closest(".card").querySelector(".sectionstatus .pill-status");
    var newStatus = statusMeta(computeSectionStatus(draft[secKey], secKey));
    statusBadge.className = "pill-status " + newStatus.cls;
    statusBadge.textContent = newStatus.label;
    return;
  }

  var pdfFiche = e.target.closest("[data-pdf-fiche]");
  if (pdfFiche) {
    var recP = findChantier(pdfFiche.getAttribute("data-pdf-fiche"));
    if (recP) exportPDF("fiche-visite-" + safeFilename(recP.client) + "-" + recP.dateVisite + ".pdf", false);
    return;
  }
  if (e.target.closest("[data-pdf-recap]")) { exportPDF("recapitulatif-chantiers-" + todayISO() + ".pdf", true); return; }
}, false);

document.addEventListener("input", function (e) {
  var t = e.target;
  if (t.matches(".evalitem-comment")) {
    var parts = t.getAttribute("data-comment").split("|");
    draft[parts[0]][parts[1]].commentaire = t.value;
  }
}, false);

document.addEventListener("submit", function (e) {
  var form = e.target.closest("#chantier-form");
  if (!form) return;
  e.preventDefault();
  if (!validateForm(form)) { form.querySelector(".invalid input")?.focus(); return; }
  var fd = new FormData(form);
  ["client", "adresse", "dateVisite", "ttaReferent", "autresTta", "typeToiture"].forEach(function (name) {
    draft[name] = fd.get(name) || "";
  });
  draft.updatedAt = new Date().toISOString();
  var recordToSave = draft;
  persist(function (state) {
    var idx = -1;
    for (var i = 0; i < state.chantiers.length; i++) if (state.chantiers[i].id === recordToSave.id) idx = i;
    if (idx >= 0) state.chantiers[idx] = recordToSave; else state.chantiers.push(recordToSave);
  });
  editingId = recordToSave.id;
  view = "detail";
  draft = null;
  render();
  window.scrollTo(0, 0);
}, false);

/* ---------- Initialisation ---------- */
function applyConfig(cfg) {
  if (!cfg || typeof cfg !== "object") return;
  if (cfg.sections && cfg.sections.securite && cfg.sections.organisation) {
    SECTION_DEFS = cfg.sections;
    configSource = "data.json";
  }
  if (Array.isArray(cfg.typesToiture) && cfg.typesToiture.length) TYPES_TOITURE = cfg.typesToiture;
}
function boot(cfg) {
  applyConfig(cfg);
  var local = loadLocal();
  if (local) STATE = local;
  else if (cfg && Array.isArray(cfg.chantiers)) STATE = { chantiers: cfg.chantiers.slice() };
  STATE.chantiers = STATE.chantiers.map(normalizeRecord);
  render();
}
fetch("data.json", { cache: "no-cache" })
  .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(boot)
  .catch(function () { boot(null); }); // ouverture en local (file://) ou fichier absent : paramétrage par défaut

})();
</script>
